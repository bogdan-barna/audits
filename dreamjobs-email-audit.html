`JobRecommendationListener` → `JobRecommendationNotification`","recipient":"Job seeker (subscribed)","type":"Marketing — Job Recommendations","template":"`mail.recommended-jobs` 📅","status":"Törölhető / letiltható","priority":"Alacsony","title":"Állásajánlások (heti)","huTitle":"5.2 Állásajánlások (heti)","roTitle":"5.2 Recomandări de joburi (săptămânal)","huHtml":"\u003ch3>5.2 Állásajánlások (heti)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>recommended-jobs-weekly\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új munkahelyen fejlesztenéd a tudásod?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ezen a héten is új lehetőségek várnak!\u003c/p>\u003cp>A megjelölt kategóriák alapján az alábbi új állás(ok) érdekes lehet számodra\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>5.2 Recomandări de joburi (săptămânal)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>recommended-jobs-weekly\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Vrei să-ți dezvolți abilitățile la un job nou?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Săptămâna aceasta îți aduce noi oportunități!\u003c/p>\u003cp>Pe baza categoriilor marcate pe profilul tău, credem că următoarele joburi pot fi interesante pentru tine:\u003c/p>\u003c/blockquote>"},{"id":40,"trigger":"Saved job reminder (scheduled)","origin":"`dj`","handler":"`SavedJobReminder` command → `SavedJobReminderEvent` → `SavedJobReminderListener` → `SavedJobReminderNotification`","recipient":"Job seeker","type":"Engagement — Saved Job Alert","template":"*(internal template)* 📅","status":"Nem törölhető","priority":"Magas","title":"Elmentett állás emlékeztető","huTitle":"5.3 Elmentett állás emlékeztető","roTitle":"5.3 Memento job salvat","huHtml":"\u003ch3>5.3 Elmentett állás emlékeztető\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>saved-job-reminder\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Most még tudsz jelentkezni\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Korábban sikeresen elmentetted a következő állást:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Figyelmeztetés:\u003c/strong> A jelentkezési határidő hamarosan lejár. Ne maradj le az álom állásodról, jelentkezz még ma!\u003c/p>","roHtml":"\u003ch3>5.3 Memento job salvat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>saved-job-reminder\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Încă poți aplica!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Anterior ai salvat cu succes job-ul de mai jos:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Avertisment:\u003c/strong> Termenul de înregistrare expiră curând. Nu rata jobul tău de vis, aplică chiar azi!\u003c/p>"},{"id":41,"trigger":"Job notification subscription (Nuxt/API)","origin":"`dj-nuxt` → `dj-api`","handler":"`AuthenticationController` → `JobNotificationSubscribeNotification`","recipient":"Subscriber","type":"Transactional — Subscription Confirmation","template":"`mail/job-notification.blade.php` ⚡","status":"Nem törölhető","priority":"Magas","title":"Állásértesítő feliratkozás megerősítése","huTitle":"1.9 Állásértesítő feliratkozás megerősítése","roTitle":"1.9 Confirmare abonare la notificări de joburi","huHtml":"\u003ch3>1.9 Állásértesítő feliratkozás megerősítése\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>job-notification\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/job-notification.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Feliratkoztál a DreamJobs állásértesítőjére\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Kedves :name!\u003c/p>\u003cp>Sikeresen feliratkoztál az állásértesítő hírlevelünkre, így egy lépéssel közelebb kerültél, hogy rátalálj új munkahelyedre.\u003c/p>\u003cp>Mostantól a megadott érdeklődési körök alapján személyre szabott állásértesítőket küldünk neked, hogy minél gyorsabban rátalálj a következő nagy lehetőségre – legyen az rugalmas munkaidő, inspiráló munkakörnyezet, kutyabarát iroda vagy épp vonzóbb juttatási csomag.\u003c/p>\u003cp>A belépéshez szükséges ideiglenes jelszavad: \u003cstrong>:pw\u003c/strong>\u003c/p>\u003cp>Ha úgy érzed, túl sok értesítést kapsz, a levelek alján található Leiratkozás gombra kattintva, vagy IDE KATTINTVA könnyedén módosíthatod a beállításaidat.\u003c/p>\u003cp>Kérdés esetén írj bátran a :address címre.\u003c/p>\u003cp>Sikeres álláskeresést kívánunk!\u003c/p>\u003c/blockquote>\u003ch3>2. Állásjelentkezések\u003c/h3>","roHtml":"\u003ch3>1.9 Confirmare abonare la notificări de joburi\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>job-notification\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/job-notification.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ești abonat la alerta de joburi DreamJobs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dragă :name,\u003c/p>\u003cp>Te-ai abonat cu succes la newsletter-ul nostru de alerte de joburi, deci ești cu un pas mai aproape de a-ți găsi noul loc de muncă.\u003c/p>\u003cp>De acum înainte, îți vom trimite alerte de joburi personalizate pe baza ariei de interes selectate, pentru a te ajuta să găsești mai rapid următoarea ta mare oportunitate - fie că este vorba de un program de lucru flexibil, de un mediu de lucru inspirațional, de un birou pet-friendly sau de un pachet de beneficii mai atractiv.\u003c/p>\u003cp>Parola ta temporară de acces: \u003cstrong>:pw\u003c/strong>\u003c/p>\u003cp>Dacă simți că primești prea multe notificări, poți accesa cu ușurință setările tale, fie dând clic pe butonul Dezabonare din josul e-mailurilor noastre, fie CLICK AICI.\u003c/p>\u003cp>În caz de întrebări, nu ezita să ne contactezi la :address.\u003c/p>\u003cp>Îți dorim mult succes în căutarea jobului ideal!\u003c/p>\u003c/blockquote>\u003ch3>2. Aplicații la Joburi\u003c/h3>"},{"id":42,"trigger":"Unfinished profile reminder (scheduled)","origin":"`dj`","handler":"`UnfinishedProfileNotification` command → `UnfinishedProfileNotification`","recipient":"Job seeker","type":"Engagement — Profile Completion","template":"*(internal template)* 📅","status":"Törölhető / letiltható","priority":"Közepes","title":"Profil törlése megerősítő","huTitle":"4.9 Profil törlése megerősítő","roTitle":"4.9 Confirmare ștergere profil","huHtml":"\u003ch3>4.9 Profil törlése megerősítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj)\u003c/strong>\u003c/td>\u003ctd>Adattörlés DreamJo.bs rendszerből\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj-api)\u003c/strong>\u003c/td>\u003ctd>Felhasználói adattörlés a DreamJobs rendszerből!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (dj):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Rendszerünkből a(z) :email e-mail címmel regisztrált felhasználóhoz tartozó adatok törlésének folyamata kérésedre megkezdődött.\u003c/p>\u003cp>A teljes folyamat maximum 30 napot vesz igénybe.\u003c/p>\u003cp>Ennek során a felhasználóhoz tartozó adatokat és bejegyzéseket eltávolítjuk a DreamJo.bs-ból és a kapcsolódó rendszerekből.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (dj-api):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Rendszerünkből a(z) :email e-mail címmel regisztrált felhasználóhoz tartozó adatok törlésének folyamata kérésedre megkezdődött. Ennek során a felhasználóhoz tartozó adatokat és bejegyzéseket eltávolítjuk a DreamJobs rendszeréből.\u003c/p>\u003c/blockquote>\u003ch3>5. Felhasználói Engagement és Marketing\u003c/h3>","roHtml":"\u003ch3>4.9 Confirmare ștergere profil\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor din sistemul DreamJobs Romania\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj-api)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor utilizatorului din sistemul DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (dj):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor pentru utilizatorul cu adresa de email :email a fost inițiat la cererea ta.\u003c/p>\u003cp>Procesul complet poate dura până la 30 de zile.\u003c/p>\u003cp>În această perioadă, datele și înregistrările asociate utilizatorului vor fi eliminate din DreamJobs și din sistemele sale conexe.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj (dj-api):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor asociate contului cu adresa de e-mail :email din sistemul DreamJobs a fost inițiat conform solicitării tale. Pe durata acestui proces, datele și înregistrările corespunzătoare vor fi eliminate din DreamJobs.\u003c/p>\u003c/blockquote>\u003ch3>5. Engagement Utilizatori și Marketing\u003c/h3>"},{"id":43,"trigger":"B2B newsletter (scheduled)","origin":"`dj`","handler":"`SendB2BNotification` command → `B2BNotification`","recipient":"B2B contact list","type":"Marketing — Newsletter","template":"`mail.b2b-newsletter` 📅","status":"Törölhető / letiltható","priority":"Alacsony","title":"Cég regisztrálva","huTitle":"4.1 Cég regisztrálva","roTitle":"10.1 Notificare recenzie job","huHtml":"\u003ch3>4.1 Cég regisztrálva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>company-registered\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.company-registered\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (HU piac):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdvözlünk! Sikeresen regisztráltad a cégedet! Ismerd meg a Vezérlőpultot!\u003c/p>\u003cp>- \u003cstrong>Kezdd el elkészíteni a cégprofilodat\u003c/strong> és publikáld! Ha segítségre van szükséged, nézd át a segédletünket vagy kérdezz a kijelölt kapcsolattartódtól bizalommal!\u003c/p>\u003cp>- :contact_name / :contact_phone / :contact_email\u003c/p>\u003cp>- \u003cstrong>Vedd meg az első hirdetésedet!\u003c/strong>\u003c/p>\u003cp>- \u003cstrong>Vásárolj hirdetési csomagokat!\u003c/strong> Használd ki a mennyiségi kedvezményeket! Hirdetési csomagjaink 6 hónapos beváltási határidővel használhatók fel!\u003c/p>\u003cp>- \u003cstrong>Készítsd el az ÁLLÁSHIRDETÉSEDET!\u003c/strong> Az elkészült álláshirdetéshez válaszd ki az előre megvásárolt hirdetési csomagot és publikáld!\u003c/p>\u003cp>- Nézd meg a DreamJo.bs egyéb szolgáltatásait is a Dashboardon!\u003c/p>\u003cp>- \u003cstrong>Gold Business Profil\u003c/strong> — Employer Branding szolgáltatás\u003c/p>\u003cp>- \u003cstrong>Talent Pool\u003c/strong> — Jelöltkereső szolgáltatás\u003c/p>\u003cp>Örülünk, hogy Ti is velünk vagytok!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (RO piac):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szia!\u003c/p>\u003cp>Sikeresen regisztráltad a cégedet, és egy lépéssel közelebb kerültél ahhoz, hogy megtaláld a legmegfelelőbb jelölteket.\u003c/p>\u003cp>👉 Első lépésként hozd létre és publikáld a céges profilodat...\u003c/p>\u003cp>Köszönjük, hogy a DreamJobsot választottad!\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>10.1 Notificare recenzie job\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>job-review\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.jobreviewcreated\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Sugestie nouă\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Am examinat anunțul de job din perspective HR și Marketing și avem următoarele sugestii:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Modific anunțul meu  \u003cbr>\u003cstrong>Sugestie:\u003c/strong> Te rugăm să modifici anunțul cât mai curând pentru o relevanță mai mare și mai mulți candidați.  \u003cbr>\u003cstrong>Mulțumire:\u003c/strong> Îți mulțumim că publici la noi!  \u003cbr>\u003cstrong>Ajutor:\u003c/strong> Dacă ai alte întrebări, nu ezita să contactezi persoana de contact DreamJobs.\u003c/p>\u003ch3>11. Administrare și Altele\u003c/h3>"},{"id":44,"trigger":"Virtual bench newsletter (scheduled)","origin":"`dj`","handler":"`SendVirtualBenchNotification` / `VirtualBenchNotification` commands → `VirtualBench*Notification`","recipient":"VB-subscribed job seekers","type":"Marketing — VB Newsletter","template":"*(internal templates)* 📅","status":"Törölhető / letiltható","priority":"Alacsony","title":"Virtual Bench hírlevél (preferenciák kérése)","huTitle":"5.7 Virtual Bench hírlevél (preferenciák kérése)","roTitle":"5.7 Virtual Bench newsletter (cerere preferințe)","huHtml":"\u003ch3>5.7 Virtual Bench hírlevél (preferenciák kérése)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>virtualbench-newsletter\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Szívesen dolgoznál náluk? Add meg, hogy milyen terület érdekel!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Korábban jelezted, hogy szívesen dolgoznál a(z) \u003cstrong>:company\u003c/strong> munkatársaként.\u003c/p>\u003cp>Add meg, vagy aktualizáld profilodban, hogy milyen területen, milyen szintű pozíció érdekelne, hogy tudathassuk a céggel is!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Ugrás a profilomra!\u003c/p>","roHtml":"\u003ch3>5.7 Virtual Bench newsletter (cerere preferințe)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>virtualbench-newsletter\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ți-ar plăcea să lucrezi la ei? Completează ce domeniu te interesează!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Anterior ai indicat că ți-ar plăcea să lucrezi ca și coleg al companiei \u003cstrong>:company\u003c/strong>.\u003c/p>\u003cp>Completează sau actualizează-ți profilul cu informațiile despre domeniul și nivelul de poziție care te interesează, pentru a le putea transmite și companiei!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Accesez profilul meu!\u003c/p>"},{"id":45,"trigger":"Lovable workplaces voting (scheduled)","origin":"`dj`","handler":"`SendLovableWorkplacesVotingNotification` command → `LovableWorkplacesVotingNotification`","recipient":"Users","type":"Marketing — Campaign","template":"`mail.lovable-workplaces-voting` 📅","status":"Törölhető / letiltható","priority":"Alacsony","title":"Lovable Workplaces szavazás","huTitle":"5.11 Lovable Workplaces szavazás","roTitle":"5.11 Vot Lovable Workplaces","huHtml":"\u003ch3>5.11 Lovable Workplaces szavazás\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>lovable-workplaces-voting\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>⭐ Elindult a Lovable Workplaces szavazás! 🚀\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szia! 👋\u003c/p>\u003cp>A kedvenc céged megérdemli, hogy a legjobb legyen! ⭐\u003c/p>\u003cp>Elindult a Lovable Workplaces szavazás.\u003c/p>\u003cp>Nagyon egyszerűen szavazhatsz:\u003c/p>\u003cp>🔎 Keresd meg a kedvenc cégedet a keresőben és szavazz rá közvetlenül az oldaláról.\u003c/p>\u003cp>Vagy\u003c/p>\u003cp>🎯 Lépj be a „Lovable Workplaces szavazás&quot; menüpontba, ahol 5 véletlenszerű céget kapsz, amire szavazhatsz.\u003c/p>\u003cp>Fontos: Csak akkor szavazhatsz, ha regisztrálsz a platformon!\u003c/p>\u003cp>🎁 Minden leadott szavazattal növeled az esélyed az értékes nyereményekre.\u003c/p>\u003cp>Lépj be most, keresd meg a kedvenc cégedet és szavazz!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Sok sikert 🚀!\u003c/p>","roHtml":"\u003ch3>5.11 Vot Lovable Workplaces\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>lovable-workplaces-voting\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>⭐ A început votul Lovable Workplaces! 🚀\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Salut! 👋\u003c/p>\u003cp>Compania ta preferată merită să fie cea mai bună! ⭐\u003c/p>\u003cp>A început votul Lovable Workplaces.\u003c/p>\u003cp>Poți vota foarte simplu:\u003c/p>\u003cp>🔎 Caută compania ta preferată în bară de căutare și votează direct de pe pagina ei.\u003c/p>\u003cp>Sau\u003c/p>\u003cp>🎯 Accesează meniu „Votul Lovable Workplaces&quot;, unde primești 5 companii aleatorii pentru care poți vota.\u003c/p>\u003cp>Important: Poți vota doar dacă te înregistrezi pe platformă!\u003c/p>\u003cp>🎁 Cu fiecare vot acordat, îți mărești șansele la premii valoroase.\u003c/p>\u003cp>Intră acum, găsește compania ta preferată și votează!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Urare:\u003c/strong> Mult succes 🚀!\u003c/p>"},{"id":46,"trigger":"Company blog post proposal","origin":"`dj`","handler":"`CompanyBlogPostProposalListener` → `CompanyBlogPostNotification`","recipient":"Company","type":"Engagement — Blog Proposal","template":"`mail.company_blog_post` ✅","status":"Törölhető / letiltható","priority":"Közepes","title":"Cégblogcikk lehetőség értesítő","huTitle":"4.8 Cégblogcikk lehetőség értesítő","roTitle":"4.8 Oportunitate articol blog companie","huHtml":"\u003ch3>4.8 Cégblogcikk lehetőség értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>company-blog-post\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Álomállások blogcikk lehetőség :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Bevezetés:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy nálunk hirdetsz! A most indított :coupon hirdetésben foglalt blog-cikk opció kapcsán keresünk az alábbi álláshirdetésed kapcsán:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A hatékony jelentkező számhoz érdemes kihasználni a DreamJobs blog Álommelók rovata adta lehetőséget. A tapasztalatok szerint a blogcikk által átlag plusz \u003cstrong>10-15%-al nő a jelentkezők száma\u003c/strong>...\u003c/p>\u003cp>Mit kell tenned? Mellékeltünk egy rövid KÉRDÉSSORT. Töltesd ki a meghirdetett pozícióhoz hasonló munkakörben lévő kollégával...\u003c/p>\u003cp>Amennyiben szeretnétek élni a blogcikk megjelenés lehetőségével, küldjétek el a válaszaitokat az általatok relevánsnak tartott kérdésekre \u003cstrong>7 napon belül\u003c/strong>...\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>4.8 Oportunitate articol blog companie\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>company-blog-post\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>DreamJobs oportunitate de articol joburi de vis :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Introducere:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că publici la noi! Referitor la opțiunea articol de blog inclusă în anunțul :coupon pe care tocmai l-ai lansat, te contactăm în legătură cu următorul anunț de job:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Pentru a obține un număr eficient de candidați, este recomandat să valorifici oportunitatea oferită de rubrica DreamJobs Joburi de Vis. Experiența arată că articolul de blog crește numărul de candidați cu o medie de \u003cstrong>10-15%\u003c/strong> în plus...\u003c/p>\u003c/blockquote>"},{"id":47,"trigger":"Profile deleted confirmation","origin":"`dj-nuxt` → `dj-api`","handler":"`ProfileDeleted` event → `SendProfileDeletionNotification` → `ProfileDeletionNotification`","recipient":"User","type":"Transactional — Deletion Confirmed","template":"`mail/profile_deleted.blade.php` ✅","status":"Nem törölhető","priority":"Magas","title":"Üdvözlő email (dj-api — job seeker regisztráció)","huTitle":"1.2 Üdvözlő email (dj-api — job seeker regisztráció)","roTitle":"1.2 Email de bun venit (dj-api — înregistrare job seeker)","huHtml":"\u003ch3>1.2 Üdvözlő email (dj-api — job seeker regisztráció)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a DreamJobs-nál, örülünk, hogy itt vagy!\u003c/p>\u003cp>Bízunk benne, hogy hamarosan rátalálsz új álommunkahelyedre - jelentsen ez rugalmas munkaidőt, összetartó csapatot vagy épp szintlépést a karrieredben.\u003c/p>\u003cp>Nézz be a cégek kulisszái mögé, és válassz a hozzád illő pozíciók közül:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Self-Branding promo blokk:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szeretnénk hatékonyan támogatni az álláskeresésben, ezért készítettük el egyedi álláskeresői megoldásunkat. Self-Branding profiljainkkal kitűnhetsz a többi jelölt közül, és kiemelheted a jelentkezésed - mutasd be kreatív eszköztárunk segítségével, hogy miben vagy erős, mitől vagy különleges!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Megnézem az állásokat | Elkészítem a Self-Branding profilom  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést kívánunk a Csapatunk nevében!  \u003cbr>\u003cstrong>Segítség:\u003c/strong> Ha bármiben segíthetünk, nyugodtan keress minket a hello@dreamjobs.hu címen.\u003c/p>","roHtml":"\u003ch3>1.2 Email de bun venit (dj-api — înregistrare job seeker)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bun venit la DreamJobs, ne bucurăm că ești alături de noi!\u003c/p>\u003cp>Suntem siguri că vei găsi noul tău loc de muncă de vis în curând - fie că este vorba de un program de lucru flexibil, de o echipă sudată sau de oportunitatea de a avansa în carieră.\u003c/p>\u003cp>Aruncă o privire în culisele companiilor și alege din pozițiile care ți se potrivesc:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Bloc promo Self-Branding:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dorim să te sprijinim eficient în căutarea unui loc de muncă, de aceea am creat soluția noastră unică pentru căutarea unui job. Profilul tău de Self-Branding te ajută să ieși în evidență față de alți candidați și să îți prezinți candidatura într-un mod autentic și convingător. Folosește instrumentele noastre creative pentru a arăta ce abilități te definesc și ce te face unic!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Văd joburile disponibile | Îmi creez profilul Self-Branding  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți ținem pumnii, mult succes în căutarea jobului perfect!  \u003cbr>\u003cstrong>Ajutor:\u003c/strong> Dacă te putem ajuta cu orice informație, scrie-ne un mail pe business@dreamjobs.ro.\u003c/p>"},{"id":48,"trigger":"New DevChallenge published (scheduled)","origin":"`dj`","handler":"`DcNewChallengeNewsletter` command → `DCNewChallengeNotification`","recipient":"DC subscribers","type":"Marketing — New Challenge","template":"`mail.dc-new-challenge` 📅","status":"Törölhető / letiltható","priority":"Alacsony","title":"Új bajnokság indult","huTitle":"6.1 Új bajnokság indult","roTitle":"6.1 Competiție nouă lansată","huHtml":"\u003ch3>6.1 Új bajnokság indult\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-new-challenge\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Indul a :title bajnokság a DevChallenge-en!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Le ne maradj! Most indul a \u003cstrong>:title bajnokság\u003c/strong> a DevChallenge oldalán! Ebben a hónapban is értékes nyereményeket szerezhetsz, ha a dobogón találod magad a verseny végén!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Csatlakozom a bajnoksághoz  \u003cbr>\u003cstrong>Link:\u003c/strong> Hogy miről szól a bajnokság?\u003c/p>","roHtml":"\u003ch3>6.1 Competiție nouă lansată\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-new-challenge\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Competiția :title a început pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Nu rata! Competiția \u003cstrong>:title\u003c/strong> tocmai a început pe DevChallenge! Și în această lună poți câștiga premii valoroase dacă te afli pe podium la sfârșitul concursului!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Mă alătur competiției  \u003cbr>\u003cstrong>Link:\u003c/strong> Despre ce este competiția?\u003c/p>"},{"id":49,"trigger":"DC user activity milestone (scheduled)","origin":"`dj`","handler":"`DcActivityNewsletters` command → `DCUserActivationNotification`","recipient":"DC user","type":"Engagement — Activity","template":"`mail.dc-activity` 📅","status":"Törölhető / letiltható","priority":"Közepes","title":"Profil törlése megerősítő","huTitle":"4.9 Profil törlése megerősítő","roTitle":"4.9 Confirmare ștergere profil","huHtml":"\u003ch3>4.9 Profil törlése megerősítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj)\u003c/strong>\u003c/td>\u003ctd>Adattörlés DreamJo.bs rendszerből\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj-api)\u003c/strong>\u003c/td>\u003ctd>Felhasználói adattörlés a DreamJobs rendszerből!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (dj):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Rendszerünkből a(z) :email e-mail címmel regisztrált felhasználóhoz tartozó adatok törlésének folyamata kérésedre megkezdődött.\u003c/p>\u003cp>A teljes folyamat maximum 30 napot vesz igénybe.\u003c/p>\u003cp>Ennek során a felhasználóhoz tartozó adatokat és bejegyzéseket eltávolítjuk a DreamJo.bs-ból és a kapcsolódó rendszerekből.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (dj-api):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Rendszerünkből a(z) :email e-mail címmel regisztrált felhasználóhoz tartozó adatok törlésének folyamata kérésedre megkezdődött. Ennek során a felhasználóhoz tartozó adatokat és bejegyzéseket eltávolítjuk a DreamJobs rendszeréből.\u003c/p>\u003c/blockquote>\u003ch3>5. Felhasználói Engagement és Marketing\u003c/h3>","roHtml":"\u003ch3>4.9 Confirmare ștergere profil\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor din sistemul DreamJobs Romania\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj-api)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor utilizatorului din sistemul DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (dj):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor pentru utilizatorul cu adresa de email :email a fost inițiat la cererea ta.\u003c/p>\u003cp>Procesul complet poate dura până la 30 de zile.\u003c/p>\u003cp>În această perioadă, datele și înregistrările asociate utilizatorului vor fi eliminate din DreamJobs și din sistemele sale conexe.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj (dj-api):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor asociate contului cu adresa de e-mail :email din sistemul DreamJobs a fost inițiat conform solicitării tale. Pe durata acestui proces, datele și înregistrările corespunzătoare vor fi eliminate din DreamJobs.\u003c/p>\u003c/blockquote>\u003ch3>5. Engagement Utilizatori și Marketing\u003c/h3>"},{"id":50,"trigger":"DC user streak (scheduled)","origin":"`dj`","handler":"`DcStreakNotification` command → `DCUserStreakNotification`","recipient":"DC user","type":"Engagement — Streak","template":"*(dc-activity variant)* 📅","status":"Törölhető / letiltható","priority":"Közepes","title":"Szériád veszélyben","huTitle":"6.5 Szériád veszélyben","roTitle":"6.5 Seria ta este în pericol","huHtml":"\u003ch3>6.5 Szériád veszélyben\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-user-streak\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Veszélyben a szériád!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Tölts ki egy kvízt, hogy ne vesszen el a szériád!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Kitöltök egy kvízt\u003c/p>","roHtml":"\u003ch3>6.5 Seria ta este în pericol\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-user-streak\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Seria ta este în pericol!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Completează un chestionar pentru ca seria ta să nu se piardă!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Completez un chestionar\u003c/p>"},{"id":51,"trigger":"DC weekly results (scheduled)","origin":"`dj`","handler":"`DcWeeklyResultsNewsletter` command → `DCWeeklyResultsNotification`","recipient":"DC subscribers","type":"Marketing — Weekly Results","template":"`mail.dc-weekly-results` 📅","status":"Törölhető / letiltható","priority":"Alacsony","title":"Heti eredmények","huTitle":"6.6 Heti eredmények","roTitle":"6.6 Rezultate săptămânale","huHtml":"\u003ch3>6.6 Heti eredmények\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-weekly-results\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Ilyen volt a heted a DevChallenge-en!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy ezen a héten is aktív voltál a DevChallenge oldalán! Kvízeinkre adott válaszadaiddal a következő eredményeket érted el:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Statisztika formátum:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Válaszaiddal a \u003cstrong>:category\u003c/strong> témakör heti ranglistáján a \u003cstrong>:weekly.\u003c/strong> helyen állsz.\u003c/p>\u003cp>Az örök ranglista helyezésed pedig a héten a következő: \u003cstrong>:alltime.\u003c/strong>\u003c/p>\u003cp>A \u003cstrong>:category\u003c/strong> témakörben \u003cstrong>:quizes\u003c/strong> kvízt töltöttél ki.\u003c/p>\u003cp>Válaszaid jelenlegi pontossága a \u003cstrong>:category\u003c/strong> témakörben: \u003cstrong>:accuracy\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Ösztönző:\u003c/strong> Még jobb eredményekre vágysz? Itt egy kvíz, amivel feljebb juthatsz a rangsorban:  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sok sikert kívánunk neked a jövő hétre is!\u003c/p>\u003ch3>7. SZMD — Szerethető Munkahelyek Díj\u003c/h3>","roHtml":"\u003ch3>6.6 Rezultate săptămânale\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-weekly-results\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Acesta a fost săptămâna ta pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că ai fost activ pe DevChallenge și săptămâna aceasta! Cu răspunsurile tale la chestionarele noastre, ai obținut următoarele rezultate:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Format statistici:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Cu răspunsurile tale, te afli pe locul \u003cstrong>:weekly\u003c/strong> în clasamentul săptămânal al categoriei \u003cstrong>:category\u003c/strong>.\u003c/p>\u003cp>Locul tău în clasamentul general săptămâna aceasta: \u003cstrong>:alltime.\u003c/strong>\u003c/p>\u003cp>Ai completat \u003cstrong>:quizes\u003c/strong> chestionare în categoria \u003cstrong>:category\u003c/strong>.\u003c/p>\u003cp>Acuratețea actuală a răspunsurilor tale în categoria \u003cstrong>:category\u003c/strong>: \u003cstrong>:accuracy\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Motivare:\u003c/strong> Vrei rezultate și mai bune? Iată un chestionar cu care poți urca în clasament:  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți dorim mult succes și săptămâna viitoare!\u003c/p>\u003ch3>7. Locuri de Muncă Iubibile (SZMD/Lovable Workplaces)\u003c/h3>"},{"id":52,"trigger":"Company nominates for SZMD award","origin":"`dj`","handler":"`SzmdRenominationListener` → `SzmdRedact` Mailable","recipient":"Admin (business email)","type":"Alert — SZMD Nomination","template":"`mail.admin_szmd_redact` ⚡","status":"Nem törölhető","priority":"Kritikus","title":"Cég regisztrálva","huTitle":"4.1 Cég regisztrálva","roTitle":"7.1 Nominalizare retrasă","huHtml":"\u003ch3>4.1 Cég regisztrálva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/c c/p>\u003cp>Ha úgy érzed, valami nem stimmel a profilodban, bármikor módosíthatod az adataidat.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Profilom megtekintése\u003c/p>","roHtml":"\u003ch3>8.3 Profil SBP creat (dj-api)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>sbp_profile_created\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Profilul tău Self-Branding este gata!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bună :name!\u003c/p>\u003cp>Procesatorul nostru de CV-uri bazat pe AI al DreamJobs a creat cu succes profilul tău de Self-Branding.\u003c/p>\u003cp>Dacă simți că ceva nu este corect în profilul tău, îți poți actualiza datele oricând.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Vizualizează-ți profilul\u003c/p>"},{"id":56,"trigger":"SBP PDF report ready (scheduled)","origin":"`dj`","handler":"`SendSbpPdfNotification` command → `SbpPdfNotification`","recipient":"User","type":"Transactional — PDF Ready","template":"*(internal template)* 📅","status":"Nem törölhető","priority":"Magas","title":"Felhasználói aktivitás (7 napos, aktív)","huTitle":"6.3 Felhasználói aktivitás (7 napos, aktív)","roTitle":"6.3 Activitate utilizator (7 zile, activ)","huHtml":"\u003ch3>6.3 Felhasználói aktivitás (7 napos, aktív)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-user-active\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (7 nap)\u003c/strong>\u003c/td>\u003ctd>Újabb kvízek várnak a DevChallenge oldalán!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (15 nap)\u003c/strong>\u003c/td>\u003ctd>Visszavárunk a DevChallenge-be!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (30 nap)\u003c/strong>\u003c/td>\u003ctd>Köszönjük, hogy már egy hónapja velünk vagy a DevChallenge-ben!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>7 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Örülünk hogy már egy hete aktív tagja vagy a DevChallenge közösségnek!\u003c/p>\u003cp>És ezidő alatt nem is tétlenkedtél, :total kvízt kitöltöttél már! Kikapcsolódásként próbáld ki szórakoztató kvízeinket is:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>15 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Már tizenöt napja regisztráltál a DevChallenge közösségébe és ezidő alatt :total kvízt töltöttél ki!\u003c/p>\u003cp>Fantasztikus aktivitás! Az eddigi kitöltéseid alapján javasoljuk neked az alábbi kvízeket is:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>30 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Már egy hónap eltelt, mióta csatlakoztál a DevChallenge közösséghez! Külön köszönet azért, hogy ezidő alatt aktívan részt vettél a kvízek kitöltésében is! Ezeket a kvízeinket is próbáltad már?\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözletek:\u003c/strong> Sok sikert! | Jó szórakozást kívánunk! | Alig várjuk, hogy gratulálhassunk neked!\u003c/p>","roHtml":"\u003ch3>6.3 Activitate utilizator (7 zile, activ)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-user-active\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (7 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteaptă mai multe chestionare pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (15 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteptăm înapoi pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (30 zile)\u003c/strong>\u003c/td>\u003ctd>Îți mulțumim că ești alături de noi de o lună pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj 7 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ne bucurăm că ești deja de o săptămână un membru activ al comunității DevChallenge!\u003c/p>\u003cp>Și în acest timp nu ai stat degeaba, ai completat deja :total chestionare! Ca relaxare, încearcă și chestionarele noastre amuzante:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj 15 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>De cincisprezece zile ești înregistrat în comunitatea DevChallenge și în acest timp ai completat :total chestionare!\u003c/p>\u003cp>Activitate fantastică! Pe baza completărilor tale anterioare, îți recomandăm și aceste chestionare:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj 30 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A trecut deja o lună de când te-ai alăturat comunității DevChallenge! Mulțumiri speciale pentru că în acest timp ai participat activ și la completarea chestionarelor! Ai mai încercat aceste chestionare ale noastre?\u003c/p>\u003c/blockquote>"},{"id":57,"trigger":"SBP search free credit awarded","origin":"`dj`","handler":"`SbpSearchFreeCreditNotification`","recipient":"User","type":"Engagement — Free Credit","template":"*(internal template)*","status":"Törölhető / letiltható","priority":"Közepes","title":"SBP Talent Pool ingyenes kredit","huTitle":"8.4 SBP Talent Pool ingyenes kredit","roTitle":"8.4 Credit gratuit Talent Pool SBP","huHtml":"\u003ch3>8.4 SBP Talent Pool ingyenes kredit\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>sbp-search-free-credit\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Ajándék: Contact Credit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Jó hírünk van! A megvásárolt Cappuccino / Cappuccino Extra hirdetéseidet amennyiben :date-ig beváltod, akkor Cappuccino esetén 2 db, Cappuccino Extra esetén 4db próba Contact Credit jár, amelyeket a DreamJo.bs Talent Pooljában tudsz felhasználni.\u003c/p>\u003cp>Mi is ez?\u003c/p>\u003cp>A Talent Pool egy \u003cstrong>skill alapú jelöltkereső\u003c/strong>, ahol a preferenciád szerint kereshetsz az aktív álláskeresők anonim bemutatkozói között. A jelölteket elmentheted és ha valakit megkeresnél egy állásajánlattal, akkor egy-egy contact credit beváltásával tudsz majd az adataihoz hozzáférni.\u003c/p>\u003cp>A Contact Creditek \u003cstrong>10-es és 35-ös csomagokban\u003c/strong> lesznek megvásárolhatók a Dashboardon.\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>8.4 Credit gratuit Talent Pool SBP\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>sbp-search-free-credit\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Cadou: Contact Credit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Avem vești bune! Dacă utilizezi pachetele achiziționate Cappuccino/Cappuccino Extra până la \u003cstrong>:date\u003c/strong>, vei primi 2 credite de contact pentru fiecare anunț de angajare Cappuccino și 4 credite de contact pentru Cappuccino Extra, pe care le poți utiliza în DreamJobs Talent Pool.\u003c/p>\u003cp>Ce este Talent Pool-ul?\u003c/p>\u003cp>\u003cstrong>Talent Pool Candidate Finder\u003c/strong> este un skill de căutare bazat pe abilitățile candidaților. Prin această metodă, pe baza preferințelor tale, poți vedea prezentările candidaților activi și pasivi. Din această bază de date, poți salva pe cei mai potriviți candidați. Iar dacă găsești pe cineva cu o ofertă de muncă, poți accesa datele lui prin valorificarea unui credit de contact.\u003c/p>\u003cp>Creditele de contact vor fi disponibile pe Dashboard, în pachete de 10 și 35 de bucăți.\u003c/p>\u003c/blockquote>"},{"id":58,"trigger":"SBP search lunch promo","origin":"`dj`","handler":"`SbpSearchLunchNotification`","recipient":"User","type":"Marketing — Promo","template":"*(internal template)*","status":"Törölhető / letiltható","priority":"Alacsony","title":"SBP Talent Pool launch értesítő","huTitle":"8.5 SBP Talent Pool launch értesítő","roTitle":"8.5 Lansare Talent Pool SBP","huHtml":"\u003ch3>8.5 SBP Talent Pool launch értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>sbp-search-lunch\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Elindult a DreamJo.bs Talent Pool\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Jó hírünk van! Elindult a DreamJo.bs \u003cstrong>Talent Pool\u003c/strong> &quot;pick and hire&quot; szolgáltatása! Mi is ez? Egy \u003cstrong>skill alapú jelöltkereső\u003c/strong>, ahol a preferenciád szerint kereshetsz az aktív álláskeresők anonim bemutatkozói között...\u003c/p>\u003cp>Bevezető akció: \u003cstrong>2022. április 30-ig\u003c/strong> minden futó \u003cstrong>Cappuccino hirdetéshez 2 db Contact Credit\u003c/strong>, minden futó \u003cstrong>Cappuccino Extra hirdetéshez 4 db Contact Credit\u003c/strong> próba csomagot adunk.\u003c/p>\u003c/blockquote>\u003ch3>9. Megosztás és Meghívók\u003c/h3>","roHtml":"\u003ch3>8.5 Lansare Talent Pool SBP\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>sbp-search-lunch\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Serviciul al DreamJobs Talent Pool Candidate Finder a început!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Serviciul &quot;pick and hire&quot; al DreamJobs \u003cstrong>Talent Pool Candidate Finder\u003c/strong> a început! Ce înseamnă asta? Este un skill de căutare bazat pe abilitățile candidaților...\u003c/p>\u003cp>Promoție introductivă: \u003cstrong>până la 30 aprilie 2022\u003c/strong>, vom adăuga \u003cstrong>2 credite\u003c/strong> de contact la fiecare anunț de job \u003cstrong>Cappuccino\u003c/strong> și \u003cstrong>4 credite\u003c/strong> de contact la \u003cstrong>Cappuccino Extra\u003c/strong>. Creditele pot fi folosite până la expirarea anunțului.\u003c/p>\u003c/blockquote>\u003ch3>9. Distribuire și Invitații\u003c/h3>"},{"id":59,"trigger":"User shares a job/company via email","origin":"`dj`","handler":"`ShareViaMailController` → `Mail::to()->send(ShareLink)`","recipient":"Friend (any email)","type":"Engagement — Share","template":"`mail.link_share_{modelType}` ⚡","status":"Törölhető / letiltható","priority":"Közepes","title":"Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj-api)","huTitle":"2.2 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj-api)","roTitle":"9.2 Link distribuit pe email (companie)","huHtml":"\u003ch3>2.2 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj-api)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>application-b2c\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/application_b2c.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :company @ :job\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (cég nélkül)\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (standard):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a \u003cstrong>:company\u003c/strong> céghez a DreamJo.bs állásportálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük! Ha kérdésed lenne, írj nekünk: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (cég nélkül — hide_company):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a DreamJo.bs állásportálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Jelszó ajánló (új felhasználónak):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Csak egy jelszót kell megadnod és kész is a DreamJobs regisztrációd. Ezt követően könnyedén tudsz állásokra jelentkezni és bármikor megtekintheted korábbi jelentkezéseid.\u003c/p>\u003cp>Jelszó megadásához és DreamJobs regisztrációd befejezéséhez használd az alábbi linket: link\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>SBP promo:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Tudtad, hogy már Self-branding profillal is jelentkezhetsz az állásokra nálunk? Átlagosan 10 jelentkezésből csak 2 interjú jöhet össze. Növeld az esélyed a kiválasztás során, töltsd ki és jelentkezz könnyedén legközelebb azzal!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-k:\u003c/strong> Nézz szét azon között a cégek között, akiknél a toborzás nem állt meg! | Jelentkezz a többi, hasonló állásunkra is!  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést!\u003c/p>","roHtml":"\u003ch3>9.2 Link distribuit pe email (companie)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>share-company\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>:from ți-a trimis un link\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name ți-a trimis un link către profilul unei companii de pe site-ul DreamJobs Romania\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Uită-te la profilul companiei\u003c/p>\u003ch3>10. Recenzii\u003c/h3>"},{"id":60,"trigger":"Friend invitation (IT quiz test)","origin":"`dj`","handler":"`TestController` → `FriendInviteNotification`","recipient":"Friend","type":"Engagement — Invite","template":"`mail.tests_friend_invite` ⚡","status":"Törölhető / letiltható","priority":"Közepes","title":"Barát meghívása (IT kvíz)","huTitle":"9.3 Barát meghívása (IT kvíz)","roTitle":"4.9 Confirmare ștergere profil","huHtml":"\u003ch3>9.3 Barát meghívása (IT kvíz)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003cem>(a sablonból: \u003ccode>mail.tests_friend_invite\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>:from meghívója\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>10. Értékelések\u003c/h3>","roHtml":"\u003ch3>4.9 Confirmare ștergere profil\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor din sistemul DreamJobs Romania\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj-api)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor utilizatorului din sistemul DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (dj):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor pentru utilizatorul cu adresa de email :email a fost inițiat la cererea ta.\u003c/p>\u003cp>Procesul complet poate dura până la 30 de zile.\u003c/p>\u003cp>În această perioadă, datele și înregistrările asociate utilizatorului vor fi eliminate din DreamJobs și din sistemele sale conexe.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj (dj-api):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor asociate contului cu adresa de e-mail :email din sistemul DreamJobs a fost inițiat conform solicitării tale. Pe durata acestui proces, datele și înregistrările corespunzătoare vor fi eliminate din DreamJobs.\u003c/p>\u003c/blockquote>\u003ch3>5. Engagement Utilizatori și Marketing\u003c/h3>"},{"id":61,"trigger":"Job review submitted","origin":"`dj`","handler":"`ReviewCreated` event → `ReviewCreatedEventListener` → `ReviewCreatedNotification`","recipient":"Company","type":"Transactional — New Review","template":"*(internal template)* ✅","status":"Nem törölhető","priority":"Magas","title":"Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj) er","type":"Transactional — Review Received","template":"*(internal template)* ⚡","status":"Nem törölhető","priority":"Magas","title":"Felhasználói aktivitás (7 napos, aktív)","huTitle":"6.3 Felhasználói aktivitás (7 napos, aktív)","roTitle":"6.3 Activitate utilizator (7 zile, activ)","huHtml":"\u003ch3>6.3 Felhasználói aktivitás (7 napos, aktív)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-user-active\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (7 nap)\u003c/strong>\u003c/td>\u003ctd>Újabb kvízek várnak a DevChallenge oldalán!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (15 nap)\u003c/strong>\u003c/td>\u003ctd>Visszavárunk a DevChallenge-be!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (30 nap)\u003c/strong>\u003c/td>\u003ctd>Köszönjük, hogy már egy hónapja velünk vagy a DevChallenge-ben!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>7 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Örülünk hogy már egy hete aktív tagja vagy a DevChallenge közösségnek!\u003c/p>\u003cp>És ezidő alatt nem is tétlenkedtél, :total kvízt kitöltöttél már! Kikapcsolódásként próbáld ki szórakoztató kvízeinket is:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>15 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Már tizenöt napja regisztráltál a DevChallenge közösségébe és ezidő alatt :total kvízt töltöttél ki!\u003c/p>\u003cp>Fantasztikus aktivitás! Az eddigi kitöltéseid alapján javasoljuk neked az alábbi kvízeket is:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>30 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Már egy hónap eltelt, mióta csatlakoztál a DevChallenge közösséghez! Külön köszönet azért, hogy ezidő alatt aktívan részt vettél a kvízek kitöltésében is! Ezeket a kvízeinket is próbáltad már?\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözletek:\u003c/strong> Sok sikert! | Jó szórakozást kívánunk! | Alig várjuk, hogy gratulálhassunk neked!\u003c/p>","roHtml":"\u003ch3>6.3 Activitate utilizator (7 zile, activ)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-user-active\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (7 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteaptă mai multe chestionare pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (15 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteptăm înapoi pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (30 zile)\u003c/strong>\u003c/td>\u003ctd>Îți mulțumim că ești alături de noi de o lună pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj 7 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ne bucurăm că ești deja de o săptămână un membru activ al comunității DevChallenge!\u003c/p>\u003cp>Și în acest timp nu ai stat degeaba, ai completat deja :total chestionare! Ca relaxare, încearcă și chestionarele noastre amuzante:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj 15 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>De cincisprezece zile ești înregistrat în comunitatea DevChallenge și în acest timp ai completat :total chestionare!\u003c/p>\u003cp>Activitate fantastică! Pe baza completărilor tale anterioare, îți recomandăm și aceste chestionare:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj 30 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A trecut deja o lună de când te-ai alăturat comunității DevChallenge! Mulțumiri speciale pentru că în acest timp ai participat activ și la completarea chestionarelor! Ai mai încercat aceste chestionare ale noastre?\u003c/p>\u003c/blockquote>"},{"id":64,"trigger":"Gold profile interest submitted","origin":"`dj`","handler":"`GoldEmailController` → `GoldRequestNotification`","recipient":"Admin (business) + Requester","type":"Transactional — Gold Interest","template":"`mail.gold_request_to_admin` / `mail.gold_request_to_b2b` ⚡","status":"Nem törölhető","priority":"Kritikus","title":"Gold Profil érdeklődés (adminnak)","huTitle":"11.1 Gold Profil érdeklődés (adminnak)","roTitle":"11.1 Interes profil Gold (solicitantului)","huHtml":"\u003ch3>11.1 Gold Profil érdeklődés (adminnak)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003cem>(sablon: \u003ccode>mail.gold_request_to_admin\u003c/code>)\u003c/em>\u003c/p>\u003cp>\u003cem>(Admin belső értesítő — tárgy és tartalom az igénylési adatokból épül fel)\u003c/em>\u003c/p>","roHtml":"\u003ch3>11.1 Interes profil Gold (solicitantului)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>gold-request-b2b\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Interes față de profilul GOLD DreamJobs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Am primit cu plăcere interesul tău față de serviciul nostru GOLD Profile.\u003c/p>\u003cp>Colegul nostru te va contacta în curând pentru a discuta detaliile și a te ajuta cu comanda.\u003c/p>\u003c/blockquote>"},{"id":65,"trigger":"Career advice request submitted","origin":"`dj`","handler":"`UserController` → `Mail::to()->send(AskForCareerAdvice)`","recipient":"Admin (marketing)","type":"Alert — Career Advice","template":"`mail.admin_asked_for_career_advice` ⚡","status":"Nem törölhető","priority":"Kritikus","title":"Karrie înregistrare job seeker)","huHtml":"\u003ch3>1.2 Üdvözlő email (dj-api — job seeker regisztráció)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a DreamJobs-nál, örülünk, hogy itt vagy!\u003c/p>\u003cp>Bízunk benne, hogy hamarosan rátalálsz új álommunkahelyedre - jelentsen ez rugalmas munkaidőt, összetartó csapatot vagy épp szintlépést a karrieredben.\u003c/p>\u003cp>Nézz be a cégek kulisszái mögé, és válassz a hozzád illő pozíciók közül:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Self-Branding promo blokk:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szeretnénk hatékonyan támogatni az álláskeresésben, ezért készítettük el egyedi álláskeresői megoldásunkat. Self-Branding profiljainkkal kitűnhetsz a többi jelölt közül, és kiemelheted a jelentkezésed - mutasd be kreatív eszköztárunk segítségével, hogy miben vagy erős, mitől vagy különleges!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Megnézem az állásokat | Elkészítem a Self-Branding profilom  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést kívánunk a Csapatunk nevében!  \u003cbr>\u003cstrong>Segítség:\u003c/strong> Ha bármiben segíthetünk, nyugodtan keress minket a hello@dreamjobs.hu címen.\u003c/p>","roHtml":"\u003ch3>1.2 Email de bun venit (dj-api — înregistrare job seeker)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bun venit la DreamJobs, ne bucurăm că ești alături de noi!\u003c/p>\u003cp>Suntem siguri că vei găsi noul tău loc de muncă de vis în curând - fie că este vorba de un program de lucru flexibil, de o echipă sudată sau de oportunitatea de a avansa în carieră.\u003c/p>\u003cp>Aruncă o privire în culisele companiilor și alege din pozițiile care ți se potrivesc:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Bloc promo Self-Branding:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dorim să te sprijinim eficient în căutarea unui loc de muncă, de aceea am creat soluția noastră unică pentru căutarea unui job. Profilul tău de Self-Branding te ajută să ieși în evidență față de alți candidați și să îți prezinți candidatura într-un mod autentic și convingător. Folosește instrumentele noastre creative pentru a arăta ce abilități te definesc și ce te face unic!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Văd joburile disponibile | Îmi creez profilul Self-Branding  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți ținem pumnii, mult succes în căutarea jobului perfect!  \u003cbr>\u003cstrong>Ajutor:\u003c/strong> Dacă te putem ajuta cu orice informație, scrie-ne un mail pe business@dreamjobs.ro.\u003c/p>"},{"id":67,"trigger":"Candidate Shortlist service order (dj)","origin":"`dj`","handler":"`Api\\CandidateShortlistController` → `CandidateShortlistNotification`","recipient":"Admin (business)","type":"Alert — CSL Order","template":"`mail.candidate_shortlist` ⚡","status":"Nem törölhető","priority":"Kritikus","title":"Candidate Shortlist megrendelés","huTitle":"11.4 Candidate Shortlist megrendelés","roTitle":"11.3 Comandă Candidate Shortlist","huHtml":"\u003ch3>11.4 Candidate Shortlist megrendelés\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003cem>(sablon: \u003ccode>mail.candidate_shortlist\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>:name - Candidate Shortlist megrendelés\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cem>(Admin belső értesítő)\u003c/em>\u003c/p>","roHtml":"\u003ch3>11.3 Comandă Candidate Shortlist\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003cem>(șablon: \u003ccode>mail.candidate_shortlist\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>:name - Comandă Candidate Shortlist\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cem>(Notificare internă admin)\u003c/em>\u003c/p>"},{"id":68,"trigger":"Egg hunt / Xmas promo","origin":"`dj`","handler":"`EgghunterController` → `EggHuntNotification`","recipient":"Users / Companies","type":"Marketing — Seasonal Promo","template":"`mail.egghunt` ⚡","status":"Törölhető / letiltható","priority":"Alacsony","title":"Karácsonyi/Húsvéti promo (Egg Hunt / Xmas Hunt)","huTitle":"11.6 Karácsonyi/Húsvéti promo (Egg Hunt / Xmas Hunt)","roTitle":"1.2 Email de bun venit (dj-api — înregistrare job seeker)","huHtml":"\u003ch3>11.6 Karácsonyi/Húsvéti promo (Egg Hunt / Xmas Hunt)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>egghunt\u003c/code> / \u003ccode>xmashunt\u003c/code>\u003c/p>\u003cp>\u003cstrong>Egg Hunt:\u003c/strong>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>EGGHUNT akció!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A húsvéti &quot;EGGHUNT&quot; akció keretén belül, \u003cstrong>:discount%-os kupon\u003c/strong> használatára vagy jogosult.\u003c/p>\u003cp>Kuponkódod: \u003cstrong>:coupon\u003c/strong>\u003c/p>\u003cp>Kupon felhasználható \u003cstrong>Latte, Cappuccino, vagy Cappuccino Extra\u003c/strong> hirdetésekre \u003cstrong>2023 április 25-ig\u003c/strong>.\u003c/p>\u003cp>Nincs most épp nyitott pozíció Nálatok? Semmi gond! A kedvezményesen megvásárolt csomagodat \u003cstrong>6 hónapig tudod felhasználni\u003c/strong>.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Kellemes Húsvétot kívánunk\u003c/p>\u003cp>\u003cstrong>Xmas Hunt (cégeknek):\u003c/strong>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>XMASHUNT akció!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A karácsonyi &quot;XMASHUNT&quot; akció keretén belül :discount %-os kupon használatára vagy jogosult.\u003c/p>\u003cp>Kuponkódod: :coupon\u003c/p>\u003cp>A kupon felhasználható korlátlan alkalommal az alábbi hirdetésekre: Latte, Cappuccino, Cappuccino Extra csomagokra.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Kellemes karácsonyi ünnepeket kívánunk!\u003c/p>","roHtml":"\u003ch3>1.2 Email de bun venit (dj-api — înregistrare job seeker)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bun venit la DreamJobs, ne bucurăm că ești alături de noi!\u003c/p>\u003cp>Suntem siguri că vei găsi noul tău loc de muncă de vis în curând - fie că este vorba de un program de lucru flexibil, de o echipă sudată sau de oportunitatea de a avansa în carieră.\u003c/p>\u003cp>Aruncă o privire în culisele companiilor și alege din pozițiile care ți se potrivesc:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Bloc promo Self-Branding:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dorim să te sprijinim eficient în căutarea unui loc de muncă, de aceea am creat soluția noastră unică pentru căutarea unui job. Profilul tău de Self-Branding te ajută să ieși în evidență față de alți candidați și să îți prezinți candidatura într-un mod autentic și convingător. Folosește instrumentele noastre creative pentru a arăta ce abilități te definesc și ce te face unic!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Văd joburile disponibile | Îmi creez profilul Self-Branding  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți ținem pumnii, mult succes în căutarea jobului perfect!  \u003cbr>\u003cstrong>Ajutor:\u003c/strong> Dacă te putem ajuta cu orice informație, scrie-ne un mail pe business@dreamjobs.ro.\u003c/p>"}];const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const clsStatus=s=>s==='Nem törölhető'?'status-keep':s.startsWith('Törölhető')?'status-delete':'status-check';const clsPriority=p=>p==='Kritikus'?'priority-critical':p==='Magas'?'priority-high':p==='Közepes'?'priority-medium':'priority-low';const hasLegacy=e=>/dreamjo\.bs/i.test(e.huHtml+' '+e.roHtml);const highlightLegacy=html=>html.replace(/dreamjo\.bs/gi,match=>'<mark class="legacy-mark">'+match+'</mark>');let selected=emails[0]?.id??null,activeTab='hu';const search=document.getElementById('search'),status=document.getElementById('status'),priority=document.getElementById('priority'),legacy=document.getElementById('legacy'),list=document.getElementById('emailList'),detail=document.getElementById('detail');function filtered(){const q=search.value.trim().toLowerCase();return emails.filter(e=>(!q||[e.title,e.trigger,e.recipient,e.type,e.template].join(' ').toLowerCase().includes(q))&&(!status.value||e.status===status.value)&&(!priority.value||e.priority===priority.value)&&(!legacy.value||(legacy.value==='legacy'&&hasLegacy(e))||(legacy.value==='clean'&&!hasLegacy(e))))}function renderSummary(){document.getElementById('summary').innerHTML='<span>'+emails.length+' email</span><span>'+emails.filter(e=>e.status==='Nem törölhető').length+' megtartandó</span><span>'+emails.filter(e=>e.status.startsWith('Törölhető')).length+' törölhető</span><span class="legacy-summary">'+emails.filter(hasLegacy).length+' módosítandó</span>'}function renderList(){const rows=filtered();document.getElementById('resultCount').textContent=rows.length+' találat';list.innerHTML=rows.map(e=>'<button class="email-item '+(e.id===selected?'active':'')+'" data-id="'+e.id+'"><div class="email-title">'+esc(e.title)+'</div><div class="email-trigger">#'+e.id+' · '+esc(e.trigger)+'</div><div class="tags"><span class="tag '+clsStatus(e.status)+'">'+e.status+'</span><span class="tag '+clsPriority(e.priority)+'">'+e.priority+'</span>'+(hasLegacy(e)?'<span class="tag legacy-tag">Módosítás szükséges</span>':'')+'</div></button>').join('')||'<div class="empty">Nincs találat.</div>';list.querySelectorAll('.email-item').forEach(button=>button.onclick=()=>{selected=Number(button.dataset.id);activeTab='hu';renderList();renderDetail()})}function renderDetail(){const e=emails.find(row=>row.id===selected);if(!e){detail.innerHTML='<div class="empty">Válassz egy emailt.</div>';return}const audit='Trigger: '+e.trigger+'\\n\\nForrás: '+e.origin+'\\n\\nKezelő komponens: '+e.handler+'\\n\\nCímzett: '+e.recipient+'\\n\\nEmail típus: '+e.type+'\\n\\nSablon / osztály: '+e.template;const body=activeTab==='hu'?highlightLegacy(e.huHtml):activeTab==='ro'?highlightLegacy(e.roHtml):'<div class="audit-view">'+esc(audit)+'</div>';detail.innerHTML='<section class="detail-head"><div class="eyebrow">Email #'+e.id+'</div><h2>'+esc(e.title)+'</h2><p class="audit-trigger">'+esc(e.trigger)+'</p><div class="tags detail-tags"><span class="tag '+clsStatus(e.status)+'">'+e.status+'</span><span class="tag '+clsPriority(e.priority)+'">'+e.priority+'</span><span class="tag">'+esc(e.type)+'</span>'+(hasLegacy(e)?'<span class="tag legacy-tag">Módosítás szükséges</span>':'')+'</div>'+(hasLegacy(e)?'<div class="legacy-alert"><b>Módosítás szükséges:</b> az emailben még szerepel a régi DreamJo.bs megnevezés vagy hivatkozás.</div>':'')+'<div class="meta-grid"><div class="meta-item"><b>Címzett</b><span>'+esc(e.recipient)+'</span></div><div class="meta-item"><b>Forrás repo</b><span>'+esc(e.origin)+'</span></div><div class="meta-item"><b>Kezelő komponens</b><span>'+esc(e.handler)+'</span></div><div class="meta-item"><b>Sablon / osztály</b><span>'+esc(e.template)+'</span></div></div></section><section class="viewer"><div class="tabs"><button class="tab '+(activeTab==='hu'?'active':'')+'" data-tab="hu">Magyar</button><button class="tab '+(activeTab==='ro'?'active':'')+'" data-tab="ro">Română</button><button class="tab '+(activeTab==='audit'?'active':'')+'" data-tab="audit">Audit</button></div><div class="viewer-content">'+body+'</div></section>';detail.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{activeTab=button.dataset.tab;renderDetail()})}function refresh(){const rows=filtered();if(!rows.some(row=>row.id===selected)&&rows[0])selected=rows[0].id;renderList();renderDetail()}[search,status,priority,legacy].forEach(control=>control.oninput=refresh);renderSummary();refresh();
</script></body></html>
