ursor:pointer;margin:2px 0}.email-item:hover{background:#2a2a2a}.email-item.active{background:var(--surface);box-shadow:inset 3px 0 var(--accent)}.email-title{font-weight:600;line-height:1.35}.email-trigger{font-size:11px;color:#9f9f9f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;line-height:1;color:#fff}.status-keep{background:#ef4444}.status-delete{background:#16a34a}.status-check{background:#f5a400;color:#1a1200}.priority-critical{background:#dc2626}.priority-high{background:#f97316}.priority-medium{background:#eab308;color:#181200}.priority-low{background:#6b7280}.main{padding:24px;min-width:0}.detail{max-width:1050px;margin:0 auto}.detail-head{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.detail h2{font-size:25px;line-height:1.25;margin:7px 0 5px}.audit-trigger{color:var(--muted);margin:0}.detail-tags{margin-top:15px}.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:14px}.meta-item{background:var(--surface-2);padding:13px}.meta-item b{display:block;color:#fff;margin-bottom:4px}.meta-item span{color:#c9c9c9;font-size:12px;overflow-wrap:anywhere}.viewer{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}.tabs{display:flex;gap:4px;padding:9px 11px 0;border-bottom:1px solid var(--border)}.tab{border:0;background:transparent;color:#b7b7b7;font:inherit;font-weight:600;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent}.tab:hover{color:#fff}.tab.active{color:#93c5fd;border-bottom-color:var(--accent)}.viewer-content{padding:25px .legacy-select{grid-column:1/-1}.legacy-tag{background:#dc2626!important;color:#fff!important;box-shadow:0 0 0 1px rgba(255,255,255,.12)}.legacy-summary{border-color:#dc2626!important;color:#fee2e2!important}.legacy-mark{background:#dc2626;color:#fff;border-radius:4px;padding:1px 4px;font-weight:700}.legacy-alert{margin-top:14px;padding:12px 14px;background:#3b1111;border:1px solid #dc2626;border-radius:9px;color:#fee2e2;font-weight:600}.legacy-alert b{color:#fff}.email-item,.tab,.tag,.meta-item,.summary span,.search,select,.viewer-content tbody tr{transition:background-color .16s ease,color .16s ease,border-color .16s ease,transform .16s ease,filter .16s ease}.email-item:hover{background:#343434;transform:translateX(2px)}.email-item.active:hover{background:var(--surface)}.viewer-content tbody tr:hover{background:#373737}.viewer-content tbody tr:hover td{color:#fff}.meta-item:hover{background:#303030}.tab:hover{background:#353535;border-radius:7px 7px 0 0}.tag:hover{filter:brightness(1.18);transform:translateY(-1px)}.summary span:hover{background:#363636;border-color:#565656}.search:hover,select:hover{border-color:#777}.viewer-content a:hover{color:#bae6fd;text-decoration-thickness:2px}.brand{gap:0}body{font-size:16px}.brand h1{font-size:20px}.brand p{font-size:13px}.summary span{font-size:13px}.search{font-size:15px}select{font-size:13px}.result-count{font-size:13px}.email-title{font-size:15px}.email-trigger{font-size:12px}.tag{font-size:11px;padding:5px 9px}.eyebrow{font-size:13px}.detail h2{font-size:28px}.audit-trigger{font-size:15px}.meta-item b{font-size:15px}.meta-item span{font-size:14px}.tab{font-size:15px}.viewer-content{font-size:16px;line-height:1.7}.viewer-content h3{font-size:23px}.viewer-content th,.viewer-content td{font-size:15px}.legacy-alert{font-size:15px}@media(max-width:700px){body{font-size:15px}.detail h2{font-size:23px}.viewer-content{font-size:15px}}</style></head><body><div class="app"><header class="topbar"><div class="brand"><div><h1>Email audit</h1><p>DreamJobs értesítési katalógus</p></div></div><div class="summary" id="summary"></div></header><div class="shell"><aside class="sidebar"><div class="filters"><input class="search" id="search" placeholder="Email keresése…"><div class="selects"><select id="status"><option value="">Minden státusz</option><option>Nem törölhető</option><option>Törölhető / letiltható</option><option>Ellenőrizendő</option></select><select id="priority"><option value="">Minden prioritás</option><option>Kritikus</option><option>Magas</option><option>Közepes</option><option>Alacsony</option></select><select id="legacy" class="legacy-select"><option value="">Minden márkanév</option><option value="legacy">Módosítás szükséges — DreamJo.bs</option><option value="clean">Nem szükséges módosítás</option></select></div><div class="result-count" id="resultCount"></div></div><div class="email-list" id="emailList"></div></aside><main class="main"><div class="detail" id="detail"></div></main></div></div><script>
const emails=[{"id":1,"trigger":"User registers via Nuxt","origin":"`dj-nuxt` → `dj-api`","handler":"`WelcomeNotificationListener` → `WelcomeNotification`","recipient":"New user","type":"Transactional — Welcome","template":"`mail.welcome` ✅","status":"Nem törölhető","priority":"Magas","title":"Üdvözlő email (dj — dashboard felhasználó)","huTitle":"1.1 Üdvözlő email (dj — dashboard felhasználó)","roTitle":"1.1 Email de bun venit (dj — utilizator dashboard)","huHtml":"\u003ch3>1.1 Üdvözlő email (dj — dashboard felhasználó)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a jófej álláskeresők közt, mi a DreamJo.bs-nál nagyon örülünk, hogy csatlakoztál!\u003c/p>\u003cp>Reméljük, hamar megtalálod, amit keresel, legyen az rugalmas munkaidő, kutyabarát office, vagy egyszerűen csak magasabb fizetés.\u003c/p>\u003cp>Mutatjuk, hol találod az ország legszerethetőbb állásait:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Aláírás:\u003c/strong> Nagyon szurkolunk, eredményes álláskeresést!\u003c/p>","roHtml":"\u003ch3>1.1 Email de bun venit (dj — utilizator dashboard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe Dreamjobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bine ai venit! Noi, cei de la DreamJobs suntem foarte bucuroși, că ești alături de noi!\u003c/p>\u003cp>Sperăm, că vei găsi rapid ceea ce dorești: muncă flexibilă, un office captivant, sau pur și simplu un salariu mai bun.\u003c/p>\u003cp>Îți arătăm, unde găsești cele mai bune joburi:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Semnătură:\u003c/strong> Ținem pumnii, îți dorim succes în căutarea jobului perfect!\u003c/p>"},{"id":2,"trigger":"User registers via Nuxt","origin":"`dj-nuxt` → `dj-api`","handler":"`EmailVerificationListener` → `EmailValidationNotification`","recipient":"New user","type":"Transactional — Email Verification","template":"`mail.email_validation` ✅","status":"Nem törölhető","priority":"Magas","title":"Email cím megerősítése","huTitle":"1.4 Email cím megerősítése","roTitle":"1.4 Confirmare adresă email","huHtml":"\u003ch3>1.4 Email cím megerősítése\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code> | \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.email_validation\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Igazold vissza az e-mail címed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeres regisztráció! Egy teendőd van még, kérünk erősítsd meg email címed az alábbi linkre kattintva:\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>1.4 Confirmare adresă email\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code> | \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.email_validation\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Confirmă-ți adresa de e-mail\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai reușit să te înregistrezi! Mai ai un singur pas, te rugăm să confirmi adresa de email dând clic pe linkul de mai jos:\u003c/p>\u003c/blockquote>"},{"id":3,"trigger":"User requests password reset (Nuxt)","origin":"`dj-nuxt` → `dj-api`","handler":"`PasswordResetListener` → `PasswordResetNotification`","recipient":"User","type":"Transactional — Password Reset","template":"`mail/password-reset.blade.php` ✅","status":"Nem törölhető","priority":"Magas","title":"Jelszó-visszaállítás (dj-api — job seeker)","huTitle":"1.7 Jelszó-visszaállítás (dj-api — job seeker)","roTitle":"1.7 Resetare parolă (dj-api — job seeker)","huHtml":"\u003ch3>1.7 Jelszó-visszaállítás (dj-api — job seeker)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>password-reset\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/password-reset.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Jelszó visszaállítása\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ezt az e-mailt azért küldük, mert jelszó-visszaállítási kérelmet kezdeményeztél.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Jelszó visszaállítása  \u003cbr>\u003cstrong>Tájékoztató:\u003c/strong> Ha nem te kérted a jelszó visszaállítását, akkor nincs további teendőd.  \u003cbr>\u003cstrong>Figyelmeztetés:\u003c/strong> Ez a jelszó-visszaállító link :count perc múlva lejár.\u003c/p>","roHtml":"\u003ch3>1.7 Resetare parolă (dj-api — job seeker)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>password-reset\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/password-reset.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Resetarea parolei\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți trimitem acest e-mail deoarece am primit o solicitare de resetare a parolei pentru contul tău.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Resetează parola  \u003cbr>\u003cstrong>Informație:\u003c/strong> Dacă nu ai solicitat resetarea parolei, nu este necesară nicio acțiune suplimentară.  \u003cbr>\u003cstrong>Avertisment:\u003c/strong> Acest link de resetare a parolei va expira în :count minute.\u003c/p>"},{"id":4,"trigger":"User requests OTP login (Nuxt)","origin":"`dj-nuxt` → `dj-api`","handler":"`OtpNotification` (direct controller)","recipient":"User","type":"Transactional — OTP Code","template":"`mail/otp.blade.php` ✅","status":"Nem törölhető","priority":"Magas","title":"OTP (Egyszeri bejelentkezési kód)","huTitle":"1.8 OTP (Egyszeri bejelentkezési kód)","roTitle":"1.8 Cod OTP (cod de autentificare)","huHtml":"\u003ch3>1.8 OTP (Egyszeri bejelentkezési kód)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>otp\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/otp.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Bejelentkezési kód\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Az alábbi 6 számjegyű kód segítségével tudsz bejelentkezni a fiókodba:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Figyelmeztetés:\u003c/strong> Ez a kód :count percig érvényes.  \u003cbr>\u003cstrong>Tájékoztató:\u003c/strong> Ha nem te kérted ezt a kódot, kérjük, hagyd figyelmen kívül ezt az üzenetet.\u003c/p>","roHtml":"\u003ch3>1.8 Cod OTP (cod de autentificare)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>otp\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/otp.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Cod de autentificare\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Folosește următorul cod din 6 cifre pentru a te autentifica în contul tău:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Avertisment:\u003c/strong> Acest cod este valabil :count minute.  \u003cbr>\u003cstrong>Informație:\u003c/strong> Dacă nu ai solicitat acest cod, te rugăm să ignori acest mesaj.\u003c/p>"},{"id":5,"trigger":"User registers via dj (legacy/dashboard)","origin":"`dj`","handler":"`RegisteredEventListener` → `UserRegistered`","recipient":"New user","type":"Transactional — Welcome","template":"`mail.welcome` ✅","status":"Nem törölhető","priority":"Magas","title":"Üdvözlő email (dj — dashboard felhasználó)","huTitle":"1.1 Üdvözlő email (dj — dashboard felhasználó)","roTitle":"1.1 Email de bun venit (dj — utilizator dashboard)","huHtml":"\u003ch3>1.1 Üdvözlő email (dj — dashboard felhasználó)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a jófej álláskeresők közt, mi a DreamJo.bs-nál nagyon örülünk, hogy csatlakoztál!\u003c/p>\u003cp>Reméljük, hamar megtalálod, amit keresel, legyen az rugalmas munkaidő, kutyabarát office, vagy egyszerűen csak magasabb fizetés.\u003c/p>\u003cp>Mutatjuk, hol találod az ország legszerethetőbb állásait:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Aláírás:\u003c/strong> Nagyon szurkolunk, eredményes álláskeresést!\u003c/p>","roHtml":"\u003ch3>1.1 Email de bun venit (dj — utilizator dashboard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe Dreamjobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bine ai venit! Noi, cei de la DreamJobs suntem foarte bucuroși, că ești alături de noi!\u003c/p>\u003cp>Sperăm, că vei găsi rapid ceea ce dorești: muncă flexibilă, un office captivant, sau pur și simplu un salariu mai bun.\u003c/p>\u003cp>Îți arătăm, unde găsești cele mai bune joburi:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Semnătură:\u003c/strong> Ținem pumnii, îți dorim succes în căutarea jobului perfect!\u003c/p>"},{"id":6,"trigger":"Email validation re-send (dj)","origin":"`dj`","handler":"`UserController` → `EmailValidationNotification`","recipient":"User","type":"Transactional — Email Verification","template":"`mail.email_validation` ✅","status":"Nem törölhető","priority":"Magas","title":"Email cím megerősítése","huTitle":"1.4 Email cím megerősítése","roTitle":"1.4 Confirmare adresă email","huHtml":"\u003ch3>1.4 Email cím megerősítése\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code> | \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.email_validation\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Igazold vissza az e-mail címed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeres regisztráció! Egy teendőd van még, kérünk erősítsd meg email címed az alábbi linkre kattintva:\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>1.4 Confirmare adresă email\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code> | \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.email_validation\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Confirmă-ți adresa de e-mail\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai reușit să te înregistrezi! Mai ai un singur pas, te rugăm să confirmi adresa de email dând clic pe linkul de mai jos:\u003c/p>\u003c/blockquote>"},{"id":7,"trigger":"New dashboard manager account created","origin":"`dj`","handler":"`CompanyManagerCreated` listener → `ActivateAddedAccountNotification`","recipient":"New manager","type":"Transactional — Account Activation","template":"`mail.activateaddedaccount` ✅","status":"Nem törölhető","priority":"Magas","title":"Fiók aktiválása (új manager létrehozva)","huTitle":"4.3 Fiók aktiválása (új manager létrehozva)","roTitle":"4.3 Activare cont (manager nou creat)","huHtml":"\u003ch3>4.3 Fiók aktiválása (új manager létrehozva)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>added-manager\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.activateaddedaccount\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Meghívás céges szerkesztőnek: :company\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name meghívott szerkesztőnek a(z) \u003cstrong>:company\u003c/strong> céghez.\u003c/p>\u003cp>Kattints ide, hogy aktiváld a profilod, és kezdődhet a buli!\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>4.3 Activare cont (manager nou creat)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>added-manager\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.activateaddedaccount\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Invitație ca editor al companiei: :company\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name te-a invitat ca editor la compania \u003cstrong>:company\u003c/strong>.\u003c/p>\u003cp>Apasă aici pentru a activa profilul tău și să înceapă distracția!\u003c/p>\u003c/blockquote>"},{"id":8,"trigger":"Manager account activated by admin","origin":"`dj`","handler":"`ManagerActivated` listener → `ManagerActivatedNotification`","recipient":"Manager","type":"Transactional — Activation Confirmed","template":"`mail.manageractivated` ✅","status":"Nem törölhető","priority":"Magas","title":"Szerkesztői profil aktiválva","huTitle":"4.5 Szerkesztői profil aktiválva","roTitle":"4.5 Profil editor activat","huHtml":"\u003ch3>4.5 Szerkesztői profil aktiválva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-activated\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Aktiváltuk a szerkesztői profilod\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Sikeresen aktiváltad a szerkesztői profilodat.\u003c/p>\u003cp>Már el is kezdhetsz céges profilt szerkeszteni és álláshirdetést feladni!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Segédlet:\u003c/strong> Elérhetővé tettünk egy segédlet, amiben összeszedtük, mire lesz szükséged a céges profilod megkomponálásához.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Segédlet: A céges profil felépítése  \u003cbr>\u003cstrong>Dashboard info:\u003c/strong> Ismerd meg a vezérlőpultot - ez a lelke mindennek!  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Hajrá, reméljük, hamar megtaláljátok a jófej új kollégátokat!\u003c/p>","roHtml":"\u003ch3>4.5 Profil editor activat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>manager-activated\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ți-am activat profilul de editor\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ți-ai activat cu succes profilul de editor.\u003c/p>\u003cp>Poți începe deja să editezi profilul companiei și să publici anunțuri de joburi!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Ghid:\u003c/strong> Am publicat un ghid în care am rezumat de ce vei avea nevoie pentru a-ți compune profilul de companie.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Ghid: Structura profilului de companie  \u003cbr>\u003cstrong>Dashboard:\u003c/strong> Descoperă panoul de control — acesta este sufletul tuturor!  \u003cbr>\u003cstrong>Urare:\u003c/strong> Spor la treabă, sperăm că veți găsi curând noul vostru coleg grozav!\u003c/p>"},{"id":9,"trigger":"Manager registered/invited to company","origin":"`dj`","handler":"`ManagerRegistered` listener → `ManagerWelcomeNotification`","recipient":"Manager","type":"Transactional — Manager Welcome","template":"`mail.managerwelcome` ✅","status":"Nem törölhető","priority":"Magas", ți mărești șansele prin profilul Self-branding - completează-l și aplică simplu data viitoare!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-uri:\u003c/strong> Uită-te la companiile la care recrutarea nu s-a oprit! | Aplică și la celelalte joburi similare ale noastre!  \u003cbr>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>"},{"id":12,"trigger":"Job application submitted (Nuxt, B2B)","origin":"`dj-nuxt` → `dj-api`","handler":"`ApplicationB2BNotificationListener` → `ApplicationB2bNotification`","recipient":"Company (job owner)","type":"Transactional — New Application Alert","template":"`mail/application_b2b.blade.php` ✅","status":"Nem törölhető","priority":"Magas","title":"Új jelentkező értesítő (B2B — cégnek, dj-api)","huTitle":"2.3 Új jelentkező értesítő (B2B — cégnek, dj-api)","roTitle":"2.3 Notificare nou candidat (B2B — pentru companie, dj-api)","huHtml":"\u003ch3>2.3 Új jelentkező értesítő (B2B — cégnek, dj-api)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>application-b2b\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/application_b2b.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új jelentkező\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Remek hírünk van, \u003cstrong>:name\u003c/strong> jelentkezett a \u003cstrong>:job\u003c/strong> @ \u003cstrong>:company\u003c/strong> pozíciódra!!\u003c/p>\u003cp>Nézd meg \u003cstrong>:name\u003c/strong> jelentkezési adatait és CV-jét!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Állás jelentkezői  \u003cbr>\u003cstrong>PS:\u003c/strong> Kérünk, hogy mindenképp jelezz vissza neki, akkor is, ha nem releváns az állásra! Ez nemcsak neki fontos, a cégednek is - a jó munkáltatói márka része a visszajelzés.  \u003cbr>\u003cstrong>GDPR megjegyzés:\u003c/strong> Kérünk hogy a levélben kapott jelentkező adatokat bizalmasan, a hatályos adatvédelmi előírásoknak (GDPR) megfelelően kezeld.\u003c/p>","roHtml":"\u003ch3>2.3 Notificare nou candidat (B2B — pentru companie, dj-api)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>application-b2b\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/application_b2b.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Candidat nou\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Avem vești grozave, \u003cstrong>:name\u003c/strong> a aplicat la poziția \u003cstrong>:job\u003c/strong> @ \u003cstrong>:company\u003c/strong>!!\u003c/p>\u003cp>Vizualizați datele de candidatură și CV-ul lui \u003cstrong>:name\u003c/strong>!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Candidații jobului  \u003cbr>\u003cstrong>PS:\u003c/strong> Vă rugăm să îi trimiteți un răspuns în orice caz, chiar dacă candidatura nu este relevantă pentru acest job! Acest lucru este important nu numai pentru candidat, ci și pentru compania dvs. - un feedback adecvat face parte dintr-un brand angajator puternic.  \u003cbr>\u003cstrong>Notă GDPR:\u003c/strong> Vă rugăm să tratați datele candidaților primite în acest e-mail cu confidențialitate, în conformitate cu reglementările privind protecția datelor (GDPR) aplicabile.\u003c/p>"},{"id":13,"trigger":"Job application submitted (dj legacy)","origin":"`dj`","handler":"`Frontend\\JobApplication` listener → `AppliedToJob` Mailable","recipient":"Applicant","type":"Transactional — Application Confirmation","template":"`mail.applied_to_job` (Markdown) ⚡","status":"Nem törölhető","priority":"Magas","title":"Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)","huTitle":"2.1 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)","roTitle":"2.1 Aplicație reușită (B2C — confirmare pentru candidat, dj)","huHtml":"\u003ch3>2.1 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a \u003cstrong>:company\u003c/strong> céghez a DreamJobs álláspotálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük! Ha kérdésed lenne, írj nekünk: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megosztott adatok blokkja:\u003c/strong> A következő adataidat osztottuk meg velük, hogy felvehessék veled a kapcsolatot.\u003c/p>\u003cp>\u003cstrong>SBP promo:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Tudtad, hogy már Self-branding profillal is jelentkezhetsz az állásokra nálunk? Átlagosan 10 jelentkezésből csak 2 interjú jöhet össze. Növeld az esélyed a kiválasztás során, töltsd ki és jelentkezz könnyedén legközelebb azzal!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-k:\u003c/strong>  \u003c/p>\u003cul>\u003cli>Nézz szét azon között a cégek között, akiknél a toborzás nem állt meg!  \u003c/li>\u003cli>Jelentkezz a többi, hasonló állásunkra is!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést!\u003c/p>","roHtml":"\u003ch3>2.1 Aplicație reușită (B2C — confirmare pentru candidat, dj)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Felicitări! Ai aplicat cu succes la jobul: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai aplicat cu succes la poziția \u003cstrong>:job\u003c/strong> la compania \u003cstrong>:company\u003c/strong> prin DreamJobs.\u003c/p>\u003cp>Compania a primit aplicația ta, te rugăm să ai răbdare! Dacă ai întrebări, scrie-ne la: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Date partajate:\u003c/strong> Am partajat cu ei următoarele informații, pentru a putea să te contacteze.\u003c/p>\u003cp>\u003cstrong>Promo SBP:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Știai că poți aplica la joburi și cu un profil de Self-branding la noi? Din 10 aplicații, în medie se acordă doar 2 interviuri. Îți mărești șansele prin profilul Self-branding - completează-l și aplică simplu data viitoare!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-uri:\u003c/strong>\u003c/p>\u003cul>\u003cli>Uită-te la companiile la care recrutarea nu s-a oprit!\u003c/li>\u003cli>Aplică și la celelalte joburi similare ale noastre!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>"},{"id":14,"trigger":"Application rejected by company","origin":"`dj`","handler":"`ApplicationRejected` event → `ApplicationRejectedListener` → `ApplicationRejectedNotification`","recipient":"Applicant","type":"Transactional — Rejection","template":"`mail.application_rejected` ✅","status":"Nem törölhető","priority":"Magas","title":"Visszautasított pályázat értesítő","huTitle":"2.4 Visszautasított pályázat értesítő","roTitle":"2.4 Aplicație respinsă","huHtml":"\u003ch3>2.4 Visszautasított pályázat értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>application-rejected\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.application_rejected\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Álláspályázat eredménye: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Sajnálattal értesítünk, hogy a(z) \u003cstrong>:job\u003c/strong> pozícióra a(z) \u003cstrong>:company\u003c/strong> cégnél benyújtott jelentkezésed nem került kiválasztásra.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Bátorítás:\u003c/strong> Ne add fel! További izgalmas állásajánlataink várnak rád, amelyek talán még jobban illeszkednek a képességeidhez és karriercéljaidhoz.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Megnézem az állásokat  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sok sikert az álláskereséshez!\u003c/p>","roHtml":"\u003ch3>2.4 Aplicație respinsă\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>application-rejected\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.application_rejected\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Rezultatul candidaturii: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ne pare rău să te anunțăm că candidatura ta la poziția \u003cstrong>:job\u003c/strong> la compania \u003cstrong>:company\u003c/strong> nu a fost selectată.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Încurajare:\u003c/strong> Nu renunța! Te așteaptă alte oferte interesante de joburi care poate se potrivesc mai bine abilităților și obiectivelor tale de carieră.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Văd joburile disponibile  \u003cbr>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>"},{"id":15,"trigger":"Post-application survey (scheduled)","origin":"`dj`","handler":"`SendAppliedToJobSurveyEmail` command → `AppliedToJobSurveyNotification`","recipient":"Applicant","type":"Engagement — Survey","template":"`mail.applied_to_job_survey` 📅","status":"Törölhető / letiltható","priority":"Közepes","title":"Állásjelentkezés utáni kérdőív","huTitle":"2.5 Állásjelentkezés utáni kérdőív","roTitle":"2.5 Chestionar după aplicare la job","huHtml":"\u003ch3>2.5 Állásjelentkezés utáni kérdőív\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>applied-to-job-survey\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.applied_to_job_survey\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Kíváncsian várjuk a véleményed az állásjelentkezésről! :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy az oldalunkon keresztül jelentkeztél egy állásra!\u003c/p>\u003cp>Kíváncsian várjuk a véleményed, kérjük töltsd ki ezt a rövid kérdőívet, segítsd a munkánkat!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Kitöltöm\u003c/p>","roHtml":"\u003ch3>2.5 Chestionar după aplicare la job\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>applied-to-job-survey\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.applied_to_job_survey\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Abia așteptăm să auzim despre experiența ta de aplicare la job! :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că ai aplicat la un job prin site-ul nostru!\u003c/p>\u003cp>Suntem curioși să auzim experiența ta, te rugăm să completezi acest scurt chestionar, ajută-ne cu munca noastră!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Completez chestionarul\u003c/p>"},{"id":16,"trigger":"Unfinished job application reminder (scheduled)","origin":"`dj`","handler":"`SendUnfinishedJobApplicationsNotification` command → `UnfinishedJobApplicationNotification`","recipient":"Job seeker","type":"Engagement — Re-engagement","template":"`mail.unfinished-job-application` 📅","status":"Törölhető / letiltható","priority":"Közepes","title":"Befejezetlen állásjelentkezés emlékeztető","huTitle":"2.6 Befejezetlen állásjelentkezés emlékeztető","roTitle":"2.6 Aplicație incompletă — memento","huHtml":"\u003ch3>2.6 Befejezetlen állásjelentkezés emlékeztető\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>unfinished-job-application\u003c/code>\u003c/p>\u003cdiv c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a \u003cstrong>:company\u003c/strong> céghez a DreamJobs álláspotálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük! Ha kérdésed lenne, írj nekünk: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megosztott adatok blokkja:\u003c/strong> A következő adataidat osztottuk meg velük, hogy felvehessék veled a kapcsolatot.\u003c/p>\u003cp>\u003cstrong>SBP promo:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Tudtad, hogy már Self-branding profillal is jelentkezhetsz az állásokra nálunk? Átlagosan 10 jelentkezésből csak 2 interjú jöhet össze. Növeld az esélyed a kiválasztás során, töltsd ki és jelentkezz könnyedén legközelebb azzal!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-k:\u003c/strong>  \u003c/p>\u003cul>\u003cli>Nézz szét azon között a cégek között, akiknél a toborzás nem állt meg!  \u003c/li>\u003cli>Jelentkezz a többi, hasonló állásunkra is!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést!\u003c/p>","roHtml":"\u003ch3>2.1 Aplicație reușită (B2C — confirmare pentru candidat, dj)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Felicitări! Ai aplicat cu succes la jobul: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai aplicat cu succes la poziția \u003cstrong>:job\u003c/strong> la compania \u003cstrong>:company\u003c/strong> prin DreamJobs.\u003c/p>\u003cp>Compania a primit aplicația ta, te rugăm să ai răbdare! Dacă ai întrebări, scrie-ne la: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Date partajate:\u003c/strong> Am partajat cu ei următoarele informații, pentru a putea să te contacteze.\u003c/p>\u003cp>\u003cstrong>Promo SBP:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Știai că poți aplica la joburi și cu un profil de Self-branding la noi? Din 10 aplicații, în medie se acordă doar 2 interviuri. Îți mărești șansele prin profilul Self-branding - completează-l și aplică simplu data viitoare!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-uri:\u003c/strong>\u003c/p>\u003cul>\u003cli>Uită-te la companiile la care recrutarea nu s-a oprit!\u003c/li>\u003cli>Aplică și la celelalte joburi similare ale noastre!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>"},{"id":26,"trigger":"Invoice created — admin copy","origin":"`dj`","handler":"Same listener → `CardPayment` Mailable","recipient":"Admin/finance team","type":"Transactional — Payment Admin Alert","template":"`mail.admin_card_payment` ⚡","status":"Nem törölhető","priority":"Kritikus","title":"Állás megjelent (pending fizetés után)","huTitle":"3.1 Állás megjelent (pending fizetés után)","roTitle":"3.1 Job publicat (după plată în așteptare)","huHtml":"\u003ch3>3.1 Állás megjelent (pending fizetés után)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>plan-pending-created\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003ct \u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (HU piac):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdvözlünk! Sikeresen regisztráltad a cégedet! Ismerd meg a Vezérlőpultot!\u003c/p>\u003cp>- \u003cstrong>Kezdd el elkészíteni a cégprofilodat\u003c/strong> és publikáld! Ha segítségre van szükséged, nézd át a segédletünket vagy kérdezz a kijelölt kapcsolattartódtól bizalommal!\u003c/p>\u003cp>- :contact_name / :contact_phone / :contact_email\u003c/p>\u003cp>- \u003cstrong>Vedd meg az első hirdetésedet!\u003c/strong>\u003c/p>\u003cp>- \u003cstrong>Vásárolj hirdetési csomagokat!\u003c/strong> Használd ki a mennyiségi kedvezményeket! Hirdetési csomagjaink 6 hónapos beváltási határidővel használhatók fel!\u003c/p>\u003cp>- \u003cstrong>Készítsd el az ÁLLÁSHIRDETÉSEDET!\u003c/strong> Az elkészült álláshirdetéshez válaszd ki az előre megvásárolt hirdetési csomagot és publikáld!\u003c/p>\u003cp>- Nézd meg a DreamJo.bs egyéb szolgáltatásait is a Dashboardon!\u003c/p>\u003cp>- \u003cstrong>Gold Business Profil\u003c/strong> — Employer Branding szolgáltatás\u003c/p>\u003cp>- \u003cstrong>Talent Pool\u003c/strong> — Jelöltkereső szolgáltatás\u003c/p>\u003cp>Örülünk, hogy Ti is velünk vagytok!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (RO piac):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szia!\u003c/p>\u003cp>Sikeresen regisztráltad a cégedet, és egy lépéssel közelebb kerültél ahhoz, hogy megtaláld a legmegfelelőbb jelölteket.\u003c/p>\u003cp>👉 Első lépésként hozd létre és publikáld a céges profilodat...\u003c/p>\u003cp>Köszönjük, hogy a DreamJobsot választottad!\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>4.1 Companie înregistrată\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>company-registered\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.company-registered\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (piața RO):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Salut!\u003c/p>\u003cp>Te-ai înregistrat cu succes și ești cu un pas mai aproape de a găsi cei mai potriviți candidați.\u003c/p>\u003cp>👉 Ca prim pas, creează și publică profilul companiei tale...\u003c/p>\u003cp>Îți mulțumim că ai ales DreamJobs!\u003c/p>\u003c/blockquote>"},{"id":34,"trigger":"New company admin assigned","origin":"`dj`","handler":"`NewCompanyAdminEvent` → `NewCompanyAdminListener` → `NewCompanyAdminNotification`","recipient":"Admin / marketing (RO)","type":"Alert — New Company Admin","template":"*(internal template)* ✅","status":"Nem törölhető","priority":"Kritikus","title":"Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)","huTitle":"2.1 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)","roTitle":"2.1 Aplicație reușită (B2C — confirmare pentru candidat, dj)","huHtml":"\u003ch3>2.1 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a \u003cstrong>:company\u003c/strong> céghez a DreamJobs álláspotálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük! Ha kérdésed lenne, írj nekünk: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megosztott adatok blokkja:\u003c/strong> A következő adataidat osztottuk meg velük, hogy felvehessék veled a kapcsolatot.\u003c/p>\u003cp>\u003cstrong>SBP promo:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Tudtad, hogy már Self-branding profillal is jelentkezhetsz az állásokra nálunk? Átlagosan 10 jelentkezésből csak 2 interjú jöhet össze. Növeld az esélyed a kiválasztás során, töltsd ki és jelentkezz könnyedén legközelebb azzal!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-k:\u003c/strong>  \u003c/p>\u003cul>\u003cli>Nézz szét azon között a cégek között, akiknél a toborzás nem állt meg!  \u003c/li>\u003cli>Jelentkezz a többi, hasonló állásunkra is!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést!\u003c/p>","roHtml":"\u003ch3>2.1 Aplicație reușită (B2C — confirmare pentru candidat, dj)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Felicitări! Ai aplicat cu succes la jobul: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai aplicat cu succes la poziția \u003cstrong>:job\u003c/strong> la compania \u003cstrong>:company\u003c/strong> prin DreamJobs.\u003c/p>\u003cp>Compania a primit aplicația ta, te rugăm să ai răbdare! Dacă ai întrebări, scrie-ne la: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Date partajate:\u003c/strong> Am partajat cu ei următoarele informații, pentru a putea să te contacteze.\u003c/p>\u003cp>\u003cstrong>Promo SBP:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Știai că poți aplica la joburi și cu un profil de Self-branding la noi? Din 10 aplicații, în medie se acordă doar 2 interviuri. Îți mărești șansele prin profilul Self-branding - completează-l și aplică simplu data viitoare!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-uri:\u003c/strong>\u003c/p>\u003cul>\u003cli>Uită-te la companiile la care recrutarea nu s-a oprit!\u003c/li>\u003cli>Aplică și la celelalte joburi similare ale noastre!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>"},{"id":35,"trigger":"Company manager added to company","origin":"`dj`","handler":"`CompanyManagerAdded` event → `CompanyManagerAdded` listener → `CompanyManagerAddedNotification`","recipient":"New manager","type":"Transactional — Manager Invitation","template":"`mail.manager_added` ✅","status":"Nem törölhető","priority":"Magas","title":"Meghívás céges szerkesztőnek (meglévő felhasználó)","huTitle":"4.2 Meghívás céges szerkesztőnek (meglévő felhasználó)","roTitle":"4.2 Invitație editor companie (utilizator existent)","huHtml":"\u003ch3>4.2 Meghívás céges szerkesztőnek (meglévő felhasználó)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-added\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Meghívás céges szerkesztőnek\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>:name\u003c/strong> meghívott a(z) \u003cstrong>:company\u003c/strong> céges szerkesztőjének
